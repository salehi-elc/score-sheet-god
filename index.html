*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b0e08;--surface:#151a10;--surface-2:#1d2415;--ink:#f2f5e9;--muted:#a9b39b;--line:#2c3620;--lime:#b9e62e;--lime-ink:#141810;--poster:#101408;--poster-2:#1a2008;--amber:#e6a817;--red:#d43a31;--good:#57b368;--mid:#e0aa2e;--low:#e06a61;--shadow:0 10px 28px rgba(0,0,0,.45);--radius:14px}
html{scrollbar-gutter:stable}
body{background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;min-height:100vh;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.wrap{max-width:960px;margin:0 auto;padding:0 14px 60px}
/* ===== header: black poster band ===== */
.topbar{background:radial-gradient(560px 300px at 88% -40%,rgba(185,230,46,.28),transparent 65%),radial-gradient(420px 260px at 4% 130%,rgba(185,230,46,.14),transparent 60%),var(--poster);color:#f5f8ea;border:2px solid #262e16;border-radius:0 0 22px 22px;padding:26px 22px 22px;margin:0 -14px}
.topbar h1{margin:0;font-size:42px;font-weight:900;line-height:1.15;letter-spacing:-.01em}
.topbar h1 em{font-style:normal;color:var(--lime)}
.hmeta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.teacher-chip{background:var(--lime);color:var(--lime-ink);font-weight:800;font-size:15px;border-radius:999px;padding:4px 16px}
.academy{font-size:14px;font-weight:500;color:#dfe8c8;direction:ltr}
.brand{font-weight:900;font-size:32px}
.brand b{color:var(--lime)}
.topbar .sub{font-size:14px;color:#dfe8c8;font-weight:500}
.topbar .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--lime);border-radius:10px;background:var(--lime);color:var(--lime-ink);font-weight:800;font-size:15px;padding:9px 20px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.lime{background:var(--lime)}
.btn.dark{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost{background:transparent;color:#f5f8ea;border-color:rgba(245,248,234,.4)}
.btn.small{font-size:14px;padding:8px 16px}
.btn.danger{background:transparent;border-color:var(--red);color:#f0998f}
.btn:disabled{opacity:.45;cursor:not-allowed}
h1.page{font-weight:900;font-size:34px;line-height:1.2;margin:26px 2px 4px}
p.lead{font-size:15.5px;font-weight:500;color:var(--muted);margin:0 2px 18px;line-height:1.7}
.backbtn{display:inline-flex;align-items:center;gap:6px;margin-top:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;font-weight:700;font-size:13.5px}
/* ===== pick head ===== */
.pick-head{display:flex;align-items:baseline;gap:12px;margin:2px 0 14px}
.pick-head h2{margin:0;font-size:22px;font-weight:900}
.pick-head .bar{flex:1;height:3px;background:var(--lime);border-radius:2px;align-self:center}
.pick-head span{font-size:13px;color:var(--muted)}
/* ===== teacher switch ===== */
.teacher-switch{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.tchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 16px;font-weight:800;font-size:15px}
.tchip.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
/* ===== class grid: old poster cards ===== */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px}
.card{font-family:inherit;text-align:right;position:relative;overflow:hidden;padding:14px 16px;background:radial-gradient(320px 210px at 88% -12%,rgba(185,230,46,.30),transparent 62%),radial-gradient(240px 180px at 0% 112%,rgba(185,230,46,.12),transparent 60%),var(--poster);color:#f5f8ea;border:2px solid #262e16;border-radius:18px;display:flex;flex-direction:column;gap:6px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(245,248,234,.14) 1.2px,transparent 1.4px);background-size:15px 15px;-webkit-mask-image:linear-gradient(215deg,transparent 58%,#000 96%);mask-image:linear-gradient(215deg,transparent 58%,#000 96%)}
.cardlink{display:block}
.cardlink:hover .card{transform:translateY(-3px);border-color:rgba(185,230,46,.55);box-shadow:0 16px 34px rgba(16,20,8,.32)}
.cc-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;position:relative;z-index:1}
.series{background:var(--lime);color:var(--lime-ink);font-size:10px;font-weight:900;letter-spacing:.13em;direction:ltr;border-radius:6px;padding:3px 8px}
.lvl{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--lime);direction:ltr}
.cc-stage{position:relative;display:flex;justify-content:center;padding:12px 0 8px;z-index:1}
.cc-ghost{position:absolute;top:-20px;inset-inline-end:0;z-index:0;font-size:118px;font-weight:900;line-height:1;direction:ltr;color:rgba(185,230,46,.07);-webkit-text-stroke:2px rgba(185,230,46,.38)}
.cc-stage img{width:62%;max-width:168px;aspect-ratio:2/3;object-fit:cover;object-position:top center;border-radius:8px;border:3px solid #f5f8ea;box-shadow:0 18px 34px rgba(0,0,0,.55);filter:saturate(1.07) contrast(1.03);transform:rotate(-2deg);transition:transform .25s ease;position:relative;z-index:1}
.cardlink:nth-child(even) .cc-stage img{transform:rotate(2deg)}
.cardlink:hover .cc-stage img{transform:rotate(0deg) scale(1.03)}
.cc-stage .designed{width:62%;max-width:168px;aspect-ratio:2/3;border-radius:8px;border:3px solid #f5f8ea;box-shadow:0 18px 34px rgba(0,0,0,.55);transform:rotate(-2deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;text-align:center;padding:10px;position:relative;z-index:1}
.cc-stage .designed .big{font-weight:900;font-size:40px;line-height:1}
.cc-stage .designed .ser{font-weight:800;font-size:14px;opacity:.95}
.cc-bottom{display:flex;align-items:center;gap:10px;position:relative;z-index:1;border-top:1px solid rgba(245,248,234,.16);padding-top:11px;margin-top:2px}
.cc-info{display:flex;flex-direction:column}
.cc-code{font-size:27px;font-weight:900;line-height:1.1;direction:ltr;text-align:right}
.cc-count{font-size:12px;color:#a9b78d}
.cc-arrow{margin-inline-start:auto;flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;line-height:1}
.rowbtns{display:flex;gap:8px;margin-top:12px;position:relative;z-index:1}
.iconbtn{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-weight:800;font-size:15px;padding:9px 6px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.iconbtn.del{border-color:var(--red);color:#f0998f}
/* ===== teacher rows (compat) ===== */
.trow{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-top:12px;box-shadow:var(--shadow);width:100%;text-align:right;color:var(--ink)}
.avatar{width:60px;height:60px;min-width:60px;border-radius:50%;background:var(--poster);color:var(--lime);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;border:1px solid var(--line)}
.trow .nm{font-weight:900;font-size:24px;line-height:1.3}
.trow .meta{font-weight:500;font-size:15px;color:var(--muted);margin-top:2px}
.trow .chev{margin-inline-start:auto;font-size:26px;font-weight:900;color:var(--lime)}
/* ===== student rows: old roster look ===== */
.srow{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px;width:100%;text-align:right;color:var(--ink)}
.srow:hover{background:rgba(185,230,46,.12)}
.srow .rnum{width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:var(--poster);color:var(--lime);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.srow .nm{font-weight:700;font-size:17px}
.srow .sc{font-weight:700;font-size:14px;color:var(--muted)}
.srow .sc b{color:var(--ink)}
.srow .rgo{margin-inline-start:auto;flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--lime-ink);background:var(--lime);border-radius:999px;padding:2px 12px}
.srow .notexam{margin-inline-start:auto;color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap}
.srow .chev{margin-inline-start:auto;font-size:22px;font-weight:900;color:var(--lime)}
.srow .mini{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:800;font-size:14px;padding:7px 10px}
.srow .mini.del{border-color:var(--red);color:#f0998f}
/* ===== forms ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-top:16px;box-shadow:var(--shadow)}
.panel h2{font-weight:900;font-size:24px;margin-bottom:4px}
.panel .hint{font-weight:500;color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:12px}
.field{margin-top:16px}
.field label{display:block;font-weight:800;font-size:16px;margin-bottom:8px}
.field input[type=text],.field input[type=password],.field input[type=number],.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;font-weight:700;background:var(--surface-2);color:var(--ink);outline:none}
.field input:focus,.field select:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(185,230,46,.35)}
.field .req{color:#f0998f}
.err{background:rgba(212,58,49,.14);border:1px solid var(--red);color:#f0998f;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;margin-top:14px;line-height:1.6}
.ok{background:rgba(185,230,46,.12);border:1px solid var(--lime);color:#dfe8c8;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;margin-top:14px;line-height:1.6}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.segcard{border:1px solid var(--line);border-radius:16px;padding:18px 12px;text-align:center;background:var(--surface-2);color:var(--ink);font-weight:900;font-size:22px;cursor:pointer}
.segcard small{display:block;font-weight:500;font-size:14px;color:var(--muted);margin-top:4px}
.segcard.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.segcard.on small{color:var(--lime-ink)}
.bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
.bookopt{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface-2);padding:0;text-align:center;color:var(--ink)}
.bookopt .bc{height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:2px;overflow:hidden}
.bookopt .bc img{width:100%;height:100%;object-fit:cover;display:block}
.bookopt .bc .big{font-weight:900;font-size:30px;line-height:1}
.bookopt .bc .ser{font-weight:800;font-size:12px}
.bookopt .bn{padding:10px 8px;font-weight:800;font-size:14px;line-height:1.4}
.bookopt.on{box-shadow:0 0 0 3px var(--lime)}
.stepnum{display:inline-flex;width:32px;height:32px;border-radius:50%;background:var(--lime);color:var(--lime-ink);align-items:center;justify-content:center;font-weight:900;font-size:18px;margin-inline-end:10px}
.addrow{display:flex;gap:10px;margin-top:8px}
.addrow input[type=text]{flex:2}
.addrow input[type=number]{flex:1;min-width:110px}
.sturow{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;flex-wrap:wrap}
.sturow .nm{font-weight:800;font-size:17px}
.sturow .sc{font-weight:500;font-size:14px;color:var(--muted)}
.sturow .sp{flex:1}
.sturow input[type=text]{flex:2;min-width:140px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;font-weight:700;background:var(--surface);color:var(--ink)}
.sturow input[type=number]{flex:1;min-width:90px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;font-weight:700;background:var(--surface);color:var(--ink)}
.sturow .mini{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:800;font-size:14px;padding:7px 10px}
.sturow .mini.del{border-color:var(--red);color:#f0998f}

.rc{background:radial-gradient(420px 260px at 88% -30%,rgba(185,230,46,.30),transparent 62%),radial-gradient(300px 220px at 0% 115%,rgba(185,230,46,.14),transparent 60%),var(--poster);color:#f5f8ea;border-radius:18px;padding:26px 24px 24px;margin-top:22px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(16,20,8,.35)}
.rc::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(245,248,234,.13) 1.2px,transparent 1.4px);background-size:15px 15px;-webkit-mask-image:linear-gradient(215deg,transparent 55%,#000 96%);mask-image:linear-gradient(215deg,transparent 55%,#000 96%)}
.rc .rc-head{background:none;color:#f5f8ea;padding:0;text-align:right;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1}
.rc .rc-head .t1{font-weight:900;font-size:26px}
.rc .rc-head .t2{font-weight:700;font-size:14px;color:#dfe8c8;margin-top:4px;direction:ltr;text-align:left}
.rc .rc-body{padding:0;text-align:center;position:relative;z-index:1}
.rc .rc-name{font-weight:900;font-size:32px;margin:18px 0 2px}
.rc .rc-meta{font-weight:500;font-size:15px;color:#a9b78d;margin-top:4px;line-height:1.8}
.rc .big-score{font-weight:900;font-size:88px;line-height:1.1;margin-top:16px;color:var(--lime)}
.rc .big-score small{font-size:30px;font-weight:800;color:#a9b78d}
.statuspill{display:inline-block;border-radius:999px;padding:5px 26px;font-weight:900;font-size:18px;margin-top:10px}
.statuspill.pass{background:var(--lime);color:var(--lime-ink)}
.statuspill.cond{background:var(--amber);color:#141810}
.statuspill.fail{background:var(--red);color:#fff}
.rc .note{font-weight:700;font-size:15px;color:#dfe8c8;margin-top:12px;line-height:1.8}
.rc .noscore{padding:18px 10px}
.rc .noscore .big{font-size:60px}
.rc .noscore p{font-weight:900;font-size:24px;margin-top:8px;line-height:1.6}
.rc .noscore span{display:block;font-weight:500;font-size:16px;color:#a9b78d;margin-top:6px}
/* ===== popup ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.popup{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:20px;max-width:420px;width:100%;padding:28px 24px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.popup .big{font-size:56px}
.popup h3{font-weight:900;font-size:24px;margin-top:8px;line-height:1.5}
.popup p{font-weight:500;font-size:16px;color:var(--muted);margin-top:8px;line-height:1.8}
/* ===== FAB ===== */
.fab{position:fixed;bottom:24px;right:24px;z-index:50;display:inline-flex;align-items:center;gap:10px;background:var(--lime);color:var(--lime-ink);border:2px solid var(--lime);border-radius:999px;padding:14px 24px;font-weight:900;font-size:19px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.fab .plus{width:32px;height:32px;border-radius:50%;background:var(--poster);color:var(--lime);display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;line-height:1}
.fab:active{transform:scale(.96)}
/* ===== auth ===== */
.authtabs{display:flex;gap:10px;margin-top:18px}
.authtabs button{flex:1;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:900;font-size:17px;padding:12px}
.authtabs button.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.foot{text-align:center;font-weight:500;color:var(--muted);font-size:13.5px;margin-top:40px;line-height:1.8}
.foot a{color:var(--lime);text-decoration:underline}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:28px 18px;text-align:center;font-weight:700;font-size:17px;color:var(--muted);margin-top:16px;line-height:1.9}
@media (max-width:640px){
  .grid{grid-template-columns:repeat(2,1fr);gap:11px}
  .topbar h1{font-size:34px}
  .cc-code{font-size:22px}
  .cc-stage img{width:68%}
  .cc-ghost{font-size:92px;top:-12px}
  h1.page{font-size:30px}
  .rc .big-score{font-size:72px}
}
@media (prefers-reduced-motion: reduce){.card,.cc-stage img{transition:none}}

/* ================= Books ================= */
const BOOKS_ADULT = ['American English File Starter','American English File 1','American English File 2','American English File 3','American English File 4','American English File 5'];
const BOOKS_TEEN = ['Family and Friends Starter','Family and Friends 1','Family and Friends 2','Family and Friends 3','Family and Friends 4','Family and Friends 5','Family and Friends 6'];
const COVER_BY_BOOK = {};
Object.values(SEED.books).forEach(b => { COVER_BY_BOOK[b.book] = b.cover; });
function bookSeries(book){ return book.indexOf('American English File') === 0 ? 'AEF' : 'F&F'; }
function bookShort(book){
  if (book.indexOf('American English File') === 0) return book.replace('American English File ', 'AEF ');
  return book.replace('Family and Friends ', 'F&F ');
}
function bookColor(book){
  const s = bookSeries(book);
  if (s === 'AEF') return 'linear-gradient(135deg,#1d4ed8,#0f2a6b)';
  return 'linear-gradient(135deg,#0e9f6e,#065f46)';
}
function coverHTML(book, big){
  const c = COVER_BY_BOOK[book];
  if (c) return '<img src="' + c + '" alt="">';
  return '<div class="designed" style="background:' + bookColor(book) + '"><div class="big">' + esc(bookShort(book)) + '</div><div class="ser">' + esc(book) + '</div></div>';
}

function seriesName(book){ return book.indexOf('American English File') === 0 ? 'ENGLISH FILE' : 'FAMILY & FRIENDS'; }
function bookLevel(book){
  const m = book.match(/(\d+)\s*$/);
  if (m) return m[1];
  if (/Starter$/.test(book)) return 'S';
  return '';
}
function classCardInner(c, withArrow){
  const lv = bookLevel(c.book);
  const lvlText = lv === 'S' ? 'STARTER' : 'LEVEL ' + lv;
  let h = '<div class="cc-top"><span class="series">' + esc(seriesName(c.book)) + '</span><span class="lvl">' + esc(lvlText) + '</span></div>' +
    '<div class="cc-stage">' + (lv === 'S' ? '' : '<span class="cc-ghost" aria-hidden="true">' + esc(lv) + '</span>') + coverHTML(c.book) + '</div>' +
    '<div class="cc-bottom"><span class="cc-info"><span class="cc-code">' + esc(levelLabel(c.kind, c.level)) + '</span>' +
    '<span class="cc-count">' + classCountLabel(c.students.length) + '</span></span>';
  if (withArrow) h += '<span class="cc-arrow" aria-hidden="true">&#8592;</span>';
  return h + '</div>';
}

function uid(){ return 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function hashPw(u, p){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  const s = u + '::' + p;
  for (let i = 0; i < s.length; i++){
    const ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
}

function seedDB(){
  const t = { id: 't-mohammad', username: 'mohammad', displayName: 'محمد شولی', passHash: null, classes: [] };
  const order = [['ARC 9','adult',9],['ARC 12','adult',12],['ARC 20','adult',20],['FF18','teen',18],['FF19','teen',19],['FF26','teen',26]];
  order.forEach(([key, kind, level]) => {
    const book = SEED.books[key].book;
    const students = (SEED.roster[key] || []).map(name => {
      let score = null;
      if (SEED.scores[key] && Object.prototype.hasOwnProperty.call(SEED.scores[key], name)) score = SEED.scores[key][name];
      return { id: uid(), name, score };
    });
    t.classes.push({ id: uid(), kind, level, book, students });
  });
  return { teachers: [t] };
}

  const s = form.students[i];
  const name = (document.getElementById('f-edit-name-' + i).value || '').trim();
  const v = document.getElementById('f-edit-score-' + i).value;
  if (!name){ alert('اسم دانش‌آموز رو بنویس.'); return; }
  let score = null;
  if (v !== '' && v != null){ score = Number(v); if (isNaN(score) || score < 0 || score > 100){ alert('نمره باید بین ۰ تا ۱۰۰ باشه.'); return; } }
  s.name = name; s.score = score; s._edit = false;
  render();
}
function formDelStudent(i){ form.students.splice(i, 1); render(); }
async function formSave(){
  const err = document.getElementById('f-err');
  const fail = m => { err.innerHTML = '<div class="err">' + m + '</div>'; window.scrollTo(0, document.body.scrollHeight); };
  if (!form.kind) return fail('قدم ۱: نوع کلاس (بزرگسال یا نوجوان) رو انتخاب کن.');
  if (!form.level) return fail('قدم ۲: شماره‌ی لول رو انتخاب کن.');
  if (!form.book) return fail('قدم ۳: کتاب کلاس رو انتخاب کن.');
  if (!form.students.length) return fail('قدم ۴: حداقل یه دانش‌آموز اضافه کن.');
  const me = routeTeacher(); if (!me) return go('#/');
  const classId = form.editingId || uid();
  const data = { id: classId, kind: form.kind, level: Number(form.level), book: form.book,
    students: form.students.map(s => ({ id: s.id, name: s.name, score: s.score })) };
  try {
    const r = await apiPost('godSaveClass', Object.assign(godCreds(), { teacher: me.username, classId: classId, class: data }));
    if (!r.ok){ fail('ذخیره انجام نشد. دوباره امتحان کن.'); return; }
    form = null;
    go('#/t/' + encodeURIComponent(me.username));
    await refreshDB();
  } catch (e){ fail('به سرور وصل نشد. اینترنت رو چک کن و دوباره امتحان کن.'); }
}
/* ================= Router ================= */
function render(){
  const app = document.getElementById('app');
  if (!DB){ app.innerHTML = headerHTML(false) + '<div class="empty">⏳ در حال بارگذاری…</div>'; return; }
  const raw = (location.hash || '#/').replace(/^#\/?/, '');
  const p = raw.split('/').filter(s => s !== '');
  let html;
  if (p.length === 0) html = viewGod();
  else if (p[0] === 't' && p.length === 2) { const t = routeTeacher(); html = (isGod() && t) ? viewTeacherClasses(t) : viewGod(); }
  else if (p[0] === 't' && p.length === 3 && p[2] === 'new') html = isGod() ? viewClassForm(null) : viewGod();
  else if (p[0] === 't' && p.length === 4 && p[2] === 'edit') html = isGod() ? viewClassForm(p[3]) : viewGod();
  else html = viewGod();
  app.innerHTML = html;
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
refreshDB();
</script>
